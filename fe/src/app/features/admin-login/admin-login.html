<main class="admin-shell">
  <a class="back-link" routerLink="/">← Trang đặt vé</a>
  <section class="login-card" aria-labelledby="login-title">
    <div class="mark" aria-hidden="true">NK</div>
    <p class="eyebrow">Khu vực nhà xe</p>
    <h1 id="login-title">Đăng nhập quản trị</h1>
    <p class="intro">Quản lý lịch nghỉ và những ngày tạm ngừng nhận khách.</p>
    <form (submit)="onSubmit(); $event.preventDefault()">
      <label><span>Tài khoản</span><input type="text" autocomplete="username" [formField]="loginForm.username" /></label>
      <label><span>Mật khẩu</span><input type="password" autocomplete="current-password" [formField]="loginForm.password" /></label>
      @if (errorMessage()) { <p class="message" role="alert">{{ errorMessage() }}</p> }
      <button type="submit" [disabled]="isSubmitting()">{{ isSubmitting() ? 'Đang đăng nhập…' : 'Đăng nhập' }}</button>
    </form>
  </section>
</main>
